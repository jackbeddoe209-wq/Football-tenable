<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Tenable — Solo</title><style>*{box-sizing:border-box}body{background:#08152d;color:#fff;font-family:system-ui;margin:0}main{max-width:680px;padding:22px;margin:auto}h1{font-size:34px;line-height:1.05}b.gold{color:#ffdb69}.box{background:#142846;border:1px solid #345276;border-radius:16px;padding:18px;margin:15px 0}button{border:0;padding:12px 18px;border-radius:10px;background:#ffdc65;color:#102040;font-weight:900;cursor:pointer}input{padding:13px;border:1px solid #6382a4;background:#081730;color:white;border-radius:10px;font-size:16px;min-width:0;flex:1}form{display:flex;gap:8px}.board{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tile{background:#243d61;border-radius:9px;padding:13px 8px;min-height:58px;font-size:12px;font-weight:bold;display:flex;gap:8px;align-items:center}.tile.ok{background:#14604b}.tile strong{color:#ffdc65}small,p{color:#acc4dc}a{color:#ffdc65}.stats{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap}.stats span{background:#203858;padding:10px;border-radius:9px}#message{min-height:24px}footer{margin-top:22px;font-size:12px;color:#8ea5c2}</style><main><p>⚽ <b>FOOTBALL <b class="gold">TENABLE</b></b></p><h1>SOLO <b class="gold">CHALLENGE</b></h1><p>Ten answers. Three lives. Bank your score or go for the full ten.</p><p><a href="/multiplayer">👥 Play multiplayer instead →</a></p><div id="app"></div><footer>Football Tenable · Play on your phone or computer</footer></main><script>
const rounds=[
['2023/24 Premier League top ten',['Manchester City','Arsenal','Liverpool','Aston Villa','Tottenham Hotspur','Chelsea','Newcastle United','Manchester United','West Ham United','Crystal Palace']],
['2022/23 Premier League top ten',['Manchester City','Arsenal','Manchester United','Newcastle United','Liverpool','Brighton & Hove Albion','Aston Villa','Tottenham Hotspur','Brentford','Fulham']],
['2021/22 Premier League top ten',['Manchester City','Liverpool','Chelsea','Tottenham Hotspur','Arsenal','Manchester United','West Ham United','Leicester City','Brighton & Hove Albion','Wolverhampton Wanderers']],
['2020/21 Premier League top ten',['Manchester City','Manchester United','Liverpool','Chelsea','Leicester City','West Ham United','Tottenham Hotspur','Arsenal','Leeds United','Everton']],
['2019/20 Premier League top ten',['Liverpool','Manchester City','Manchester United','Chelsea','Leicester City','Tottenham Hotspur','Wolverhampton Wanderers','Arsenal','Sheffield United','Burnley']],
['2018/19 Premier League top ten',['Manchester City','Liverpool','Chelsea','Tottenham Hotspur','Arsenal','Manchester United','Wolverhampton Wanderers','Everton','Leicester City','West Ham United']],
['2017/18 Premier League top ten',['Manchester City','Manchester United','Tottenham Hotspur','Liverpool','Chelsea','Arsenal','Burnley','Everton','Leicester City','Newcastle United']],
['2015/16 Premier League top ten',['Leicester City','Arsenal','Tottenham Hotspur','Manchester City','Manchester United','Southampton','West Ham United','Liverpool','Stoke City','Chelsea']],
['2023/24 Championship top ten',['Leicester City','Ipswich Town','Leeds United','Southampton','West Bromwich Albion','Norwich City','Hull City','Middlesbrough','Coventry City','Preston North End']],
['2022/23 Championship top ten',['Burnley','Sheffield United','Luton Town','Middlesbrough','Coventry City','Sunderland','Blackburn Rovers','Millwall','West Bromwich Albion','Swansea City']],
['2021/22 Championship top ten',['Fulham','Bournemouth','Huddersfield Town','Nottingham Forest','Sheffield United','Luton Town','Middlesbrough','Blackburn Rovers','Millwall','West Bromwich Albion']],
['All-time Premier League appearance leaders (through 2023/24)',['Gareth Barry','James Milner','Ryan Giggs','Frank Lampard','David James','Gary Speed','Emile Heskey','Mark Schwarzer','Jamie Carragher','Phil Neville']],
['Most Premier League matches managed (through 2023/24)',['Arsène Wenger','Alex Ferguson','David Moyes','Harry Redknapp','Sam Allardyce','Steve Bruce','Mark Hughes','Roy Hodgson','José Mourinho','Rafael Benítez']],
['Argentina 2022 World Cup final outfield starters',['Nahuel Molina','Cristian Romero','Nicolás Otamendi','Nicolás Tagliafico','Rodrigo De Paul','Enzo Fernández','Alexis Mac Allister','Lionel Messi','Julián Álvarez','Ángel Di María']],
['France 2018 World Cup final outfield starters',['Benjamin Pavard','Raphaël Varane','Samuel Umtiti','Lucas Hernández','Paul Pogba','N’Golo Kanté','Kylian Mbappé','Antoine Griezmann','Blaise Matuidi','Olivier Giroud']],
['Liverpool 2019 Champions League final outfield starters',['Trent Alexander-Arnold','Joël Matip','Virgil van Dijk','Andrew Robertson','Jordan Henderson','Fabinho','Georginio Wijnaldum','Mohamed Salah','Roberto Firmino','Sadio Mané']],
['Real Madrid 2022 Champions League final outfield starters',['Dani Carvajal','Éder Militão','David Alaba','Ferland Mendy','Casemiro','Luka Modrić','Toni Kroos','Federico Valverde','Karim Benzema','Vinícius Júnior']]
];
let used=[],r=0,found=[],lives=3,score=0,round=0,finished=false,notice='';
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'').replace(/fc$/,'');
const aliases={'spurs':'Tottenham Hotspur','man city':'Manchester City','man utd':'Manchester United','man united':'Manchester United','west ham':'West Ham United','newcastle':'Newcastle United','brighton':'Brighton & Hove Albion','wolves':'Wolverhampton Wanderers','villa':'Aston Villa','palace':'Crystal Palace','west brom':'West Bromwich Albion','boro':'Middlesbrough','sheff utd':'Sheffield United'};
const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[x]||'&#39;'));
function next(){let pool=rounds.map((x,i)=>i).filter(x=>!used.includes(x));if(!pool.length){used=[];pool=rounds.map((x,i)=>i)}r=pool[Math.floor(Math.random()*pool.length)];used.push(r);found=[];lives=3;round++;finished=false;notice='';render()}
function end(why){score+=found.length*100+(why==='win'?500:0);finished=true;notice=why==='win'?'🏆 TENABLE! Perfect ten — 500 bonus points!':why==='bank'?'💰 Points banked!':'💔 Out of lives!';render()}
function guess(){let t=document.getElementById('guess').value.trim();if(!t)return;let a=aliases[t.toLowerCase()]||t;let answers=rounds[r][1];let i=answers.findIndex(x=>norm(x)===norm(a));if(i<0){let matches=answers.map((x,j)=>norm(x.split(' ').at(-1))===norm(t)?j:-1).filter(x=>x>=0);if(matches.length===1)i=matches[0]}if(i>=0&&found.includes(i)){notice='Already guessed!'}else if(i>=0){found.push(i);notice='✅ Correct! '+answers[i];if(found.length===10)return end('win')}else{lives--;notice='❌ Wrong answer!';if(!lives)return end('out')}render()}
function render(){let answers=rounds[r][1];document.getElementById('app').innerHTML='<div class="box"><div class="stats"><span>Round '+round+'</span><span>⭐ '+(score+(finished?0:found.length*100))+' pts</span><span>❤️ '+lives+'</span></div><h2>'+escape(rounds[r][0])+'</h2><p>Name the ten answers. Find all ten for a bonus.</p><div class="board">'+answers.map((x,i)=>'<div class="tile '+(found.includes(i)?'ok':'')+'"><strong>'+(i+1)+'</strong> '+(found.includes(i)||finished?escape(x):'••••••')+'</div>').join('')+'</div><p id="message">'+escape(notice)+'</p>'+(finished?'<button onclick="next()">NEXT ROUND →</button>':'<form onsubmit="event.preventDefault();guess()"><input id="guess" placeholder="Type your answer" autofocus autocomplete="off"><button>GUESS</button></form><p><button onclick="end(\'bank\')">💰 BANK '+(found.length*100)+' POINTS</button></p>')+'</div>';if(!finished)document.getElementById('guess').focus()}
next();
</script></html>
